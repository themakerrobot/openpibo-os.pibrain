<!DOCTYPE html>
<html lang="ko">
<head>
  <title>Classifier for PiBrain</title>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="../static/all.min.css" type="text/css" />
  <link rel="stylesheet" href="../static/pibo-ui.css?ver=260924v12" />
  <link rel="stylesheet" href="../static/index.css?ver=260924v1" />
  <link rel="shortcut icon" href="../static/icon.png?ver=240319v1" type="image/x-icon" />

  <script src="../static/socket.io.min.js"></script>
  <script src="../static/vendor/tfjs/tf.min.js"></script>
  <script src="../static/ko2en.js?ver=260924v1"></script>
</head>

<body class="pb pb-shell pb-refresh" data-tab="learn">
  <script>/* v2(기본)·화면 밝기를 첫 페인트 전에. pibo_ui=v1 이면 예전 화면 (규칙은 pibo-ui.js 와 같다) */
  (function () { try { var c = document.cookie, u = !/(?:^|;\s*)pibo_ui=v1/.test(c), m = c.match(/(?:^|;\s*)pibo_theme=(light|soft|dark)/);
    if (/[?&]ui=v2/.test(location.search)) u = true; if (/[?&]ui=v1/.test(location.search)) u = false;
    if (u) { document.body.classList.add('pb-v2');
      document.documentElement.setAttribute('data-theme', m ? m[1] : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'soft'));
      if (/(?:^|;\s*)pibo_frame=teal/.test(c) || /[?&]frame=teal/.test(location.search)) document.documentElement.setAttribute('data-frame', 'teal'); } } catch (e) {} })();</script>
  <header class="pb-header">
    <span class="pb-header__brand"><i class="fa-solid fa-glasses"></i>&nbsp;<span data-key="title"></span></span>
    <div class="pb-seg cls-tabs" id="tabs" role="tablist">
      <button type="button" data-tab="learn" role="tab"><i class="fa-solid fa-graduation-cap"></i><span data-key="tab_learn"></span></button>
      <button type="button" data-tab="test" role="tab"><i class="fa-solid fa-vial"></i><span data-key="tab_test"></span></button>
      <button type="button" data-tab="store" role="tab"><i class="fa-solid fa-box-archive"></i><span data-key="tab_store"></span></button>
    </div>
    <div class="pb-iconbar">
      <button type="button" class="pb-iconbtn" id="ide_bt" title="IDE"><i class="fa-solid fa-code"></i><span class="pb-iconbtn__label">IDE</span></button>
      <a class="pb-iconbtn" id="fullscreen_bt" title="Full Screen"><span id="fullscreen_txt"></span><span class="pb-iconbtn__label" data-key="nav_fullscreen"></span></a>
      <select class="pb-field pb-field--sm" id="language" aria-label="language">
        <option value="ko">한국어</option>
        <option value="en">English</option>
      </select>
      <a id="logo_bt"><img src="../static/themaker.png" style="height:22px" alt="" /></a>
    </div>
  </header>

  <div class="pb-panes">
    <!-- 왼쪽: 학습 = 입력·종류 / 시험 = 모델 고르기 -->
    <aside class="pb-pane pb-pane--fixed side" id="left_pane">
      <section class="only-learn">
        <h2 class="sec-title" data-key="what_to_learn"></h2>
        <div class="pb-seg seg-wide" id="src_seg"></div>
        <div class="pb-seg seg-wide seg-sub" id="var_seg" hidden></div>
        <div class="sec-row">
          <h2 class="sec-title" data-key="classes_title"></h2>
          <button type="button" class="pb-btn pb-btn--sm" id="cls_add"><i class="fa-solid fa-plus"></i><span data-key="class_add"></span></button>
        </div>
        <div id="cls_list"></div>
      </section>

      <section class="only-test">
        <h2 class="sec-title" data-key="test_pick"></h2>
        <div id="test_list"></div>
        <h2 class="sec-title"><span data-key="threshold"></span> <b id="thr_val"></b></h2>
        <input type="range" id="thr" min="30" max="95" step="5" aria-label="threshold">
        <p class="muted" data-key="threshold_hint"></p>
      </section>
    </aside>

    <div class="pb-resizer" data-pane="left" data-target="left_pane" data-side="left" data-min="280" role="separator" aria-orientation="vertical" aria-label="resize"></div>

    <!-- 가운데: PiBrain 카메라 / 보관함 -->
    <main class="pb-pane pb-pane--grow center">
      <section class="not-store stage-wrap">
        <div class="stage" id="stage">
          <img id="cam" alt="PiBrain camera">
          <canvas id="overlay"></canvas>
          <div class="stage-msg" id="see_hint" hidden></div>
          <div class="stage-msg stage-msg--busy" id="stage_loading" hidden><i class="fa-solid fa-spinner fa-spin"></i> <span data-key="loading_model"></span></div>
          <figure class="crop-box" id="crop_box" hidden>
            <canvas id="crop" width="224" height="224"></canvas>
            <figcaption data-key="ai_sees"></figcaption>
          </figure>
        </div>
        <div class="stage-bar">
          <button type="button" class="pb-btn pb-btn--sm" id="cam_toggle" aria-pressed="true"><i class="fa-solid fa-video-slash"></i><span id="cam_toggle_label"></span></button>
          <span class="stage-hint" id="stage_hint"></span>
        </div>
      </section>

      <section class="only-store store">
        <div class="sec-row">
          <h2 class="sec-title"><span data-key="tab_store"></span> · <code id="store_root"></code></h2>
          <button type="button" class="pb-btn pb-btn--sm" id="store_refresh"><i class="fa-solid fa-rotate"></i><span data-key="refresh"></span></button>
        </div>
        <p class="muted" data-key="store_hint"></p>
        <div id="store_list"></div>
      </section>
    </main>

    <div class="pb-resizer" data-pane="right" data-target="right_pane" data-side="right" data-min="280" role="separator" aria-orientation="vertical" aria-label="resize"></div>

    <!-- 오른쪽: 학습 = 배우기·결과·저장 / 시험 = 답 -->
    <aside class="pb-pane pb-pane--fixed side" id="right_pane">
      <section class="only-learn">
        <button type="button" class="pb-btn pb-btn--accent pb-btn--big" id="train_btn"><i class="fa-solid fa-graduation-cap"></i><span data-key="train"></span></button>
        <p class="muted" id="train_need" data-key="need_two"></p>
        <div id="train_prog" hidden>
          <progress id="train_bar" max="100" value="0"></progress>
          <p class="muted" id="train_text"></p>
        </div>

        <div id="result_sec" hidden>
          <div class="acc"><b id="acc_big"></b><span data-key="acc"></span></div>
          <p class="pb-note pb-note--warn" id="stale_note" hidden data-key="stale"></p>
          <h2 class="sec-title"><span data-key="confusion"></span> <small class="muted" data-key="confusion_hint"></small></h2>
          <div class="confusion" id="confusion"></div>

          <h2 class="sec-title" data-key="live_title"></h2>
          <div class="bars" id="learn_bars"></div>

          <h2 class="sec-title" data-key="save_title"></h2>
          <div class="save-row">
            <input type="text" class="pb-field" id="save_name" maxlength="40" data-key="save_name_ph">
            <button type="button" class="pb-btn pb-btn--accent" id="save_btn"><i class="fa-solid fa-floppy-disk"></i><span data-key="save_btn"></span></button>
          </div>
          <div class="saved" id="saved_box" hidden>
            <p><i class="fa-solid fa-circle-check"></i> <code id="saved_path"></code></p>
            <p class="muted" id="saved_block"></p>
            <code class="code" id="saved_code"></code>
            <button type="button" class="pb-btn pb-btn--sm" id="goto_test"><i class="fa-solid fa-vial"></i><span data-key="st_test"></span></button>
          </div>
        </div>
      </section>

      <section class="only-test">
        <p class="muted" id="test_empty" data-key="test_empty"></p>
        <div id="test_live" hidden>
          <p class="test-name"><b id="test_name"></b> <span class="muted" id="test_src"></span></p>
          <div class="answer" id="test_answer">—</div>
          <div class="bars" id="test_bars"></div>
        </div>
        <div id="test_photo" hidden>
          <label class="pb-btn pb-btn--sm"><i class="fa-solid fa-image"></i><span data-key="test_photo"></span><input type="file" id="photo_input" accept="image/*" hidden></label>
          <p class="muted" id="photo_result"></p>
        </div>
      </section>
    </aside>
  </div>

  <div class="pb-modal" id="dlg" hidden role="dialog" aria-modal="true">
    <div class="pb-modal__box dlg-box">
      <div class="pb-modal__head"><i class="fa-solid fa-glasses"></i><span id="dlg_title"></span></div>
      <div class="pb-modal__body dlg-body">
        <p id="dlg_text"></p>
        <input type="text" class="pb-field" id="dlg_input" maxlength="40" hidden>
      </div>
      <div class="pb-modal__foot">
        <button type="button" class="pb-btn" id="dlg_cancel"></button>
        <button type="button" class="pb-btn pb-btn--accent" id="dlg_ok"></button>
      </div>
    </div>
  </div>

  <script src="../static/pibo-ui.js?ver=260924v1"></script>
  <script type="module" src="../static/app.js?ver=260924v1"></script>
</body>
</html>
