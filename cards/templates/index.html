<!DOCTYPE html>
<html lang="ko" data-product="piBo">
<head>
  <title>카드 코딩 · piBo</title>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="piBo — 블록·파이썬 코딩 · 도구 · AI 가르치기 / Block and Python coding, tools, teach AI" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="../static/all.min.css" type="text/css" />
  <link rel="stylesheet" href="../static/pibo-ui.css?ver=261126v1" />
  <link rel="stylesheet" href="../static/cards.css?ver=261126v1" />
  <link rel="shortcut icon" href="../static/icon.png?ver=261124v1" type="image/png" />
  <!-- 문구는 IDE 의 ko2en.js 를 같이 쓴다(kids_* 키, 영문판 델타를 늘리지 않으려고). IDE(80)는 늘 떠 있다 -->
  <script>(function () { var p = new URLSearchParams(location.search).get('ide') || 80;   /* ?ide= 는 시험용 */
    document.write('<script src="http://' + location.hostname + ':' + p + '/static/ko2en.js?ver=261126v1"><\/script>');
    /* 처음 화면 그림 — 대문과 같은 파이보 캐릭터 장면(IDE 의 pibo-art.js, 261123). 못 받으면 Font Awesome 기호 */
    document.write('<script src="http://' + location.hostname + ':' + p + '/static/v2/pibo-art.js?ver=261125v1"><\/script>'); })();</script>
</head>

<!-- pb-plain: 키트의 pb-v2 층을 얹지 않는다(그 층의 앱 버튼 규칙이 카드 색을 덮는다) -->
<body data-pb-help="cards" class="pb pb-shell pb-plain kids" data-app="cards">
  <script>/* 화면 밝기를 첫 페인트 전에 (규칙은 pibo-ui.js 의 getTheme 과 같다. 고른 적 없으면 soft) */
  (function () { try { var m = document.cookie.match(/(?:^|;\s*)pibo_theme=(light|soft|dark)/);
    document.documentElement.setAttribute('data-theme', m ? m[1] : 'soft'); } catch (e) {} })();</script>
  <header class="pb-header">
    <span class="pb-header__brand"><i class="fa-solid fa-robot" id="brand_icon"></i><b id="brand_name">piBo</b><span class="pb-header__app" id="app_title"></span></span>
    <div class="pb-iconbar">
      <button type="button" class="pb-iconbtn" id="start_bt" hidden><i class="fa-solid fa-shapes"></i><span class="pb-iconbtn__label" id="start_label"></span></button>
      <!-- 설정(차시·목소리·소리 크기·기록·처음부터 하기). 잠금 없이 누구나 연다(261124, 사용자). 앱 동작이라 [처음 화면] 왼쪽(상단바 규칙 — AUDIT.md B2) -->
      <button type="button" class="pb-iconbtn" id="set_bt"><i class="fa-solid fa-gear"></i><span class="pb-iconbtn__label" data-key="kids_settings"></span></button>
      <button type="button" class="pb-iconbtn" id="home_bt" data-pb-home><i class="fa-solid fa-house"></i><span class="pb-iconbtn__label"></span></button>
      <a class="pb-iconbtn" id="fullscreen_bt" data-title-key="kids_fullscreen"><span id="fullscreen_txt"></span><span class="pb-iconbtn__label" data-key="kids_fullscreen"></span></a>
      <select class="pb-field pb-field--sm" id="language" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option></select>
    </div>
  </header>

  <main class="kids-main">
    <!-- 처음 — 도전 · 만들기 · 내 재주. cards.js 가 그린다 -->
    <section class="kids-view" id="v_home" hidden>
      <header class="kids-head" id="home_head">
        <div class="kids-head__tx"><h1 class="kids-head__t" id="home_t"></h1><p class="kids-head__d" id="home_d"></p></div>
        <div class="kids-head__sum" id="home_sum"></div>
      </header>
      <div class="kids-home" id="home_grid"></div>
    </section>

    <!-- 도전 (선생님이 고른 차시 + 지난 차시) -->
    <section class="kids-view" id="v_challenges" hidden>
      <div class="kids-bar">
        <button type="button" class="kids-back" data-go="home" data-title-key="kids_back"><i class="fa-solid fa-arrow-left"></i></button>
        <h1 class="kids-h1 kids-h1--bar" id="ch_title"></h1>
      </div>
      <div id="ch_list"></div>
    </section>

    <!-- 만들기 -->
    <section class="kids-view" id="v_make" hidden>
      <div class="kids-bar">
        <button type="button" class="kids-back" data-go="home" data-title-key="kids_back"><i class="fa-solid fa-arrow-left"></i></button>
        <div class="kids-task">
          <span class="kids-task__ic" id="task_icon"></span>
          <p class="kids-task__txt" id="task_text"></p>
          <button type="button" class="kids-round kids-round--soft" id="listen_bt" data-title-key="kids_listen"><i class="fa-solid fa-volume-high"></i></button>
          <span class="kids-stars" id="task_stars"></span>
        </div>
      </div>
      <div class="kids-rowwrap">
        <div class="kids-row" id="row" aria-live="polite"></div>
        <span class="kids-rowcount" id="row_count"></span>
      </div>
      <div class="kids-dock">
        <div class="kids-palbox">
          <div class="kids-ptabs" id="pal_tabs"></div>
          <div class="kids-palette" id="palette"></div>
        </div>
        <div class="kids-actions">
          <button type="button" class="kids-go" id="run_bt" data-title-key="kids_run"><i class="fa-solid fa-play"></i></button>
          <button type="button" class="kids-go kids-go--stop" id="stop_bt" data-title-key="kids_stop" hidden><i class="fa-solid fa-stop"></i></button>
          <div class="kids-actions__row">
            <button type="button" class="kids-round kids-round--save" id="save_bt" data-title-key="kids_save"><i class="fa-solid fa-floppy-disk"></i></button>
            <button type="button" class="kids-round" id="clear_bt" data-title-key="kids_clear"><i class="fa-solid fa-trash-can"></i></button>
            <button type="button" class="kids-round" id="export_bt" data-title-key="kids_export"><i class="fa-solid fa-puzzle-piece"></i></button>
          </div>
        </div>
      </div>
    </section>

    <!-- 내 재주 -->
    <section class="kids-view" id="v_tricks" hidden>
      <div class="kids-bar">
        <button type="button" class="kids-back" data-go="home" data-title-key="kids_back"><i class="fa-solid fa-arrow-left"></i></button>
        <h1 class="kids-h1 kids-h1--bar" data-key="kids_tricks"></h1>
      </div>
      <p class="kids-empty" id="tricks_empty" hidden><i class="fa-solid fa-wand-magic-sparkles"></i><span data-key="kids_no_tricks"></span></p>
      <div class="kids-tgrid" id="tricks_grid"></div>
    </section>

  </main>


  <!-- 재주로 저장 -->
  <div class="kids-modal" id="dlg_save" hidden>
    <div class="kids-modal__box kids-save">
      <h2 class="pb-title" id="sv_title"></h2>
      <div class="kids-save__grid">
        <div class="kids-save__preview" id="sv_preview"></div>
        <div class="kids-save__form">
          <span class="pb-label" data-key="kids_trick_name"></span>
          <input class="pb-field kids-namein" id="sv_name" maxlength="8" autocomplete="off">
          <span class="pb-label" data-key="kids_trick_icon"></span>
          <div class="kids-picks" id="sv_icons"></div>
        </div>
      </div>
      <p class="kids-note" data-key="kids_save_hint"></p>
      <div class="kids-modal__btns">
        <button type="button" class="kids-btn" data-close><span data-key="kids_cancel"></span></button>
        <button type="button" class="kids-btn kids-btn--main" id="sv_ok"><i class="fa-solid fa-floppy-disk"></i><span data-key="kids_save"></span></button>
      </div>
    </div>
  </div>

  <!-- 재주 하나 -->
  <div class="kids-modal" id="dlg_trick" hidden>
    <div class="kids-modal__box kids-trickbox">
      <h2 class="pb-title" id="tk_title"></h2>
      <div class="kids-compare__row" id="tk_row"></div>
      <div class="kids-modal__btns">
        <button type="button" class="kids-btn kids-btn--danger" id="tk_del"><i class="fa-solid fa-trash-can"></i><span data-key="kids_delete"></span></button>
        <button type="button" class="kids-btn" id="tk_edit"><i class="fa-solid fa-pen"></i><span data-key="kids_edit"></span></button>
        <button type="button" class="kids-btn kids-btn--main" id="tk_run"><i class="fa-solid fa-play"></i><span data-key="kids_run"></span></button>
        <button type="button" class="kids-btn" data-close><span data-key="kids_close"></span></button>
      </div>
    </div>
  </div>

  <!-- 도전 결과 -->
  <div class="kids-modal" id="dlg_result" hidden>
    <div class="kids-modal__box kids-result">
      <div class="kids-result__art" id="res_art"></div>
      <div class="kids-result__stars" id="res_stars"></div>
      <p class="kids-result__msg" id="res_msg"></p>
      <div class="kids-compare" id="res_compare" hidden>
        <div><span class="kids-compare__lbl" data-key="kids_want"></span><div class="kids-compare__row" id="res_want"></div></div>
        <div><span class="kids-compare__lbl" data-key="kids_mine"></span><div class="kids-compare__row" id="res_mine"></div></div>
      </div>
      <ul class="kids-miss" id="res_miss" hidden></ul>
      <div class="kids-modal__btns">
        <button type="button" class="kids-btn" id="res_again"><i class="fa-solid fa-rotate-left"></i><span data-key="kids_retry"></span></button>
        <button type="button" class="kids-btn kids-btn--main" id="res_next"><span data-key="kids_next"></span><i class="fa-solid fa-arrow-right"></i></button>
      </div>
    </div>
  </div>

  <!-- 설정 -->
  <div class="kids-modal" id="dlg_teacher" hidden>
    <div class="kids-modal__box kids-teacher">
      <h2 class="pb-title" data-key="kids_settings"></h2>
      <div class="kids-form">
        <span class="pb-label" data-key="kids_t_lesson"></span>
        <div><select class="pb-field" id="t_lesson"></select><p class="kids-lhelp" id="t_lesson_help"></p></div>
        <span class="pb-label" data-key="kids_t_voice"></span>
        <div><select class="pb-field" id="t_voice"></select><p class="kids-note" data-key="kids_t_voice_note"></p></div>
        <span class="pb-label" data-key="kids_t_volume"></span>
        <label class="kids-vol"><input type="range" id="t_volume" min="0" max="100" step="10"><b id="t_volume_v"></b></label>
      </div>
      <div class="kids-teacher__more">
        <button type="button" class="kids-btn" id="t_report"><i class="fa-solid fa-table-cells"></i><span data-key="kids_t_report"></span></button>
        <button type="button" class="kids-btn kids-btn--danger" id="t_reset_all"><i class="fa-solid fa-trash-can"></i><span data-key="kids_t_reset_all"></span></button>
      </div>
      <p class="kids-note kids-teacher__warn" id="t_reset_note" hidden></p>
      <div class="kids-modal__btns">
        <button type="button" class="kids-btn" data-close><span data-key="kids_cancel"></span></button>
        <button type="button" class="kids-btn kids-btn--main" id="t_save"><i class="fa-solid fa-check"></i><span data-key="kids_t_save"></span></button>
      </div>
    </div>
  </div>

  <!-- 도달 기록 -->
  <div class="kids-modal" id="dlg_report" hidden>
    <div class="kids-modal__box kids-reportbox">
      <h2 class="pb-title" data-key="kids_t_report"></h2>
      <p class="kids-note" data-key="kids_t_report_legend"></p>
      <div class="kids-report__wrap" id="rp_table"></div>
      <div class="kids-modal__btns">
        <button type="button" class="kids-btn kids-btn--main" data-close><span data-key="kids_close"></span></button>
      </div>
    </div>
  </div>


  <script src="../static/pibo-ui.js?ver=261126v2"></script>
  <script src="../static/pet.js?ver=261125v1"></script>   <!-- 도전 결과 그림(로봇 놀이 키우기 친구와 같은 그림) -->
  <script src="../static/cards.js?ver=261126v1"></script>
</body>
</html>
