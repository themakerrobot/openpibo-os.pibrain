<html>
  <head>
    <meta charset="utf-8">
    <script>
      // IDE [도움말] 이 ?lang=en 을 붙여 연다(영문 화면이면 영문 도움말). 없으면 한국어
      var en = /[?&]lang=en\b/.test(location.search);
      location.replace(en ? './build/en/index.html' : './build/html/index.html');
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=./build/html/index.html"></noscript>
  </head>
</html>
