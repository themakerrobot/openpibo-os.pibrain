<!DOCTYPE html>
<html lang="ko">
<!--
  Tools for PiBrain — 화면 v2 (260924, Pibo IDE v2 와 같은 모양)
    상단바(노랑)  도구 | IDE · 화면 밝기 · KO/EN
    왼쪽 레일     버튼 · LED · 카메라 · 음성 · LCD
    본문          카드. 넓으면 두 칸
  동작은 index.js(REST/SSE) 그대로다. id·onclick 은 바꾸지 않았다.
  색은 index.css 의 --c-* (IDE v2/ide.css 와 같은 값). 밝기는 쿠키 pibo_theme — IDE 에서 고른 값이 따라온다.
-->
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="shortcut icon" href="/static/icon.png" type="image/x-icon"/>
  <link rel="stylesheet" href="/static/all.min.css"/>
  <link rel="stylesheet" href="/static/pibo-ui.css?ver=260924v1"/>
  <link rel="stylesheet" href="/static/index.css?ver=260924v1"/>
  <title>Tools for PiBrain</title>
  <script>/* 화면 밝기를 첫 페인트 전에 (쿠키 pibo_theme, 기본 soft) */
    (function () { try { var m = document.cookie.match(/(?:^|;\s*)pibo_theme=(light|soft|dark)/);
      document.documentElement.setAttribute('data-theme', m ? m[1] : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'soft')); } catch (e) {} })();</script>
</head>
<body class="pb v2-app tl">

<header class="pb-header tl-top">
  <span class="tl-brand"><i class="fa-solid fa-microchip"></i><b data-key="title">도구</b><span class="tl-brand__sub">PiBrain</span></span>
  <div class="tl-actions">
    <button type="button" class="tl-hbtn" id="ide_bt" title="IDE"><i class="fa-solid fa-code"></i><span>IDE</span></button>
    <button type="button" class="tl-hbtn" id="theme_bt"><i class="fa-solid fa-circle-half-stroke"></i><span id="theme_lbl"></span></button>
    <button type="button" class="tl-hbtn tl-hbtn--lang" id="lang-toggle" onclick="toggleLang()">EN</button>
  </div>
</header>

<div class="tl-body">
<nav class="tl-rail">
  <button class="active" onclick="switchTab('buttons',this)"><i class="fa-solid fa-circle-dot"></i><span data-key="tab_buttons">버튼</span></button>
  <button onclick="switchTab('led',this)"><i class="fa-solid fa-lightbulb"></i><span data-key="tab_led">LED</span></button>
  <button onclick="switchTab('camera',this)"><i class="fa-solid fa-camera"></i><span data-key="tab_camera">카메라</span></button>
  <button onclick="switchTab('tts',this)"><i class="fa-solid fa-volume-high"></i><span data-key="tab_tts">음성</span></button>
  <button onclick="switchTab('lcd',this)"><i class="fa-solid fa-display"></i><span data-key="tab_lcd">LCD</span></button>
</nav>

<main class="tl-main">

<!-- ── 버튼 ─────────────────────────────────────────────────── -->
<section class="tab active" id="tab-buttons">
  <div class="card card--wide">
    <h2 class="card-title" data-key="button_status">버튼 상태 (실시간)</h2>
    <div class="button-grid">
      <div class="bi" id="bi-1"><div class="num">1</div><div class="lbl">OFF</div></div>
      <div class="bi" id="bi-2"><div class="num">2</div><div class="lbl">OFF</div></div>
      <div class="bi" id="bi-3"><div class="num">3</div><div class="lbl">OFF</div></div>
      <div class="bi" id="bi-4"><div class="num">4</div><div class="lbl">OFF</div></div>
    </div>
    <div class="log-box" id="btn-log" data-key="event_waiting">이벤트 대기 중...</div>
  </div>
</section>

<!-- ── LED ──────────────────────────────────────────────────── -->
<section class="tab" id="tab-led">
  <div class="card">
    <h2 class="card-title" data-key="led_title">LED 색</h2>
    <div class="led-top">
      <div class="led-preview" id="led-preview"></div>
      <label class="led-pick">
        <input type="color" class="color-picker" id="led-picker" value="#000000" oninput="applyColorPicker(this.value)"/>
        <span data-key="color_picker">컬러픽커</span>
      </label>
    </div>
    <div class="led-row">
      <label class="r">R</label>
      <input type="range"  id="r-range" min="0" max="255" value="0" oninput="syncLed('r',this.value)"/>
      <input type="number" id="r-num"   min="0" max="255" value="0" oninput="syncLed('r',this.value)"/>
    </div>
    <div class="led-row">
      <label class="g">G</label>
      <input type="range"  id="g-range" min="0" max="255" value="0" oninput="syncLed('g',this.value)"/>
      <input type="number" id="g-num"   min="0" max="255" value="0" oninput="syncLed('g',this.value)"/>
    </div>
    <div class="led-row">
      <label class="b">B</label>
      <input type="range"  id="b-range" min="0" max="255" value="0" oninput="syncLed('b',this.value)"/>
      <input type="number" id="b-num"   min="0" max="255" value="0" oninput="syncLed('b',this.value)"/>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="applyLed()"><i class="fa-solid fa-check"></i><span data-key="apply">적용</span></button>
      <button class="btn" onclick="ledOff()"><i class="fa-solid fa-power-off"></i><span data-key="led_off">끄기</span></button>
    </div>
  </div>
  <div class="card">
    <h2 class="card-title" data-key="presets_title">빠른 색</h2>
    <div class="presets">
      <button class="swatch" style="--sw:#ff0000" onclick="setPreset(255,0,0)"><i></i><span data-key="preset_red">빨강</span></button>
      <button class="swatch" style="--sw:#00ff00" onclick="setPreset(0,255,0)"><i></i><span data-key="preset_green">초록</span></button>
      <button class="swatch" style="--sw:#0000ff" onclick="setPreset(0,0,255)"><i></i><span data-key="preset_blue">파랑</span></button>
      <button class="swatch" style="--sw:#ff8c00" onclick="setPreset(255,140,0)"><i></i><span data-key="preset_orange">주황</span></button>
      <button class="swatch" style="--sw:#a000c8" onclick="setPreset(160,0,200)"><i></i><span data-key="preset_purple">보라</span></button>
      <button class="swatch" style="--sw:#ffffff" onclick="setPreset(255,255,255)"><i></i><span data-key="preset_white">흰색</span></button>
    </div>
  </div>
</section>

<!-- ── 카메라 / 비전 ────────────────────────────────────────── -->
<section class="tab" id="tab-camera">
  <div class="card">
    <h2 class="card-title" data-key="camera_title">카메라</h2>
    <div class="cam-stage">
      <div id="cam-wrap" style="display:none"><img id="cam-img" alt="camera"/></div>
      <div id="cam-ph" data-key="cam_off_msg">카메라를 켜면 기기 LCD에 표시됩니다</div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-cam" onclick="toggleCamera()"><i class="fa-solid fa-camera"></i><span data-key="cam_on_btn">카메라 켜기</span></button>
      <button class="btn" id="btn-capture" onclick="captureToWeb()" disabled><i class="fa-solid fa-image"></i><span data-key="capture_btn">웹에 표시</span></button>
    </div>
  </div>
  <div class="card">
    <h2 class="card-title" data-key="vision_title">비전 기능</h2>
    <div class="vision-grid">
      <button class="vbtn active" onclick="setVision('camera',this)"><i class="fa-solid fa-camera"></i><span data-key="v_camera">카메라</span></button>
      <button class="vbtn" onclick="setVision('grayscale',this)"><i class="fa-solid fa-circle-half-stroke"></i><span data-key="v_grayscale">흑백</span></button>
      <button class="vbtn" onclick="setVision('canny',this)"><i class="fa-solid fa-pen"></i><span data-key="v_canny">엣지</span></button>
      <button class="vbtn" onclick="setVision('edgePreservingFilter',this)"><i class="fa-solid fa-water"></i><span data-key="v_edge_pres">엣지보존</span></button>
      <button class="vbtn" onclick="setVision('cartoon',this)"><i class="fa-solid fa-palette"></i><span data-key="v_cartoon">카툰</span></button>
      <button class="vbtn" onclick="setVision('sketch_rgb',this)"><i class="fa-solid fa-pencil"></i><span data-key="v_sketch">스케치</span></button>
      <button class="vbtn" onclick="setVision('detail',this)"><i class="fa-solid fa-magnifying-glass-plus"></i><span data-key="v_detail">디테일</span></button>
      <button class="vbtn" onclick="setVision('qr',this)"><i class="fa-solid fa-qrcode"></i><span data-key="v_qr">QR코드</span></button>
      <button class="vbtn" onclick="setVision('face',this)"><i class="fa-solid fa-face-smile"></i><span data-key="v_face">얼굴인식</span></button>
      <button class="vbtn" onclick="setVision('face_landmark',this)"><i class="fa-solid fa-location-crosshairs"></i><span data-key="v_landmark">랜드마크</span></button>
      <button class="vbtn" onclick="setVision('object',this)"><i class="fa-solid fa-box"></i><span data-key="v_object">객체인식</span></button>
      <button class="vbtn" onclick="setVision('hand',this)"><i class="fa-solid fa-hand"></i><span data-key="v_hand">손인식</span></button>
      <button class="vbtn" onclick="setVision('pose',this)"><i class="fa-solid fa-person-walking"></i><span data-key="v_pose">포즈</span></button>
      <button class="vbtn" onclick="setVision('marker',this)"><i class="fa-solid fa-thumbtack"></i><span data-key="v_marker">마커</span></button>
    </div>
    <div class="marker-row" id="marker-row" style="display:none">
      <label for="marker-len" data-key="marker_len_label">마커 길이</label>
      <input type="number" id="marker-len" value="5" min="1" max="50" step="0.1"/>
      <span>cm</span>
      <button class="btn btn-sm" onclick="updateMarkerLen()" data-key="apply_sm">적용</button>
    </div>
    <div class="result-box" id="vision-result" data-key="result_ph">결과가 여기에 표시됩니다</div>
  </div>
</section>

<!-- ── 음성 ─────────────────────────────────────────────────── -->
<section class="tab" id="tab-tts">
  <div class="card">
    <h2 class="card-title" data-key="voice_select">목소리 선택</h2>
    <div class="voice-grid">
      <button class="voice-btn active" onclick="setVoice('m1',this)"><i class="fa-solid fa-person"></i>k0</button>
      <button class="voice-btn" onclick="setVoice('m2',this)"><i class="fa-solid fa-person"></i>k1</button>
      <button class="voice-btn" onclick="setVoice('m3',this)"><i class="fa-solid fa-person"></i>k2</button>
      <button class="voice-btn" onclick="setVoice('m4',this)"><i class="fa-solid fa-person"></i>k3</button>
      <button class="voice-btn" onclick="setVoice('m5',this)"><i class="fa-solid fa-person"></i>k4</button>
      <button class="voice-btn" onclick="setVoice('f1',this)"><i class="fa-solid fa-person-dress"></i>k5</button>
      <button class="voice-btn" onclick="setVoice('f2',this)"><i class="fa-solid fa-person-dress"></i>k6</button>
      <button class="voice-btn" onclick="setVoice('f3',this)"><i class="fa-solid fa-person-dress"></i>k7</button>
      <button class="voice-btn" onclick="setVoice('f4',this)"><i class="fa-solid fa-person-dress"></i>k8</button>
      <button class="voice-btn" onclick="setVoice('f5',this)"><i class="fa-solid fa-person-dress"></i>k9</button>
    </div>
  </div>
  <div class="card">
    <label class="card-title" for="tts-text" data-key="tts_label">말할 내용</label>
    <textarea id="tts-text" data-key="tts_ph" placeholder="여기에 말할 내용을 입력하세요...">안녕하세요! 저는 파이브레인입니다.</textarea>
    <div class="btn-row">
      <button class="btn btn-primary btn-grow" id="tts-btn" onclick="speakTTS()"><i class="fa-solid fa-play"></i><span data-key="speak_btn">말하기</span></button>
      <button class="btn" onclick="stopTTS()"><i class="fa-solid fa-stop"></i><span data-key="stop_tts_btn">정지</span></button>
    </div>
    <div class="result-box" id="tts-status" data-key="waiting">대기 중...</div>
  </div>
</section>

<!-- ── LCD ──────────────────────────────────────────────────── -->
<section class="tab" id="tab-lcd">
  <div class="card">
    <h2 class="card-title" data-key="lcd_preview_title">LCD 미리보기 (240×320)</h2>
    <div class="lcd-preview"><canvas id="lcd-canvas" width="240" height="320"></canvas></div>
  </div>

  <div class="card">
    <h2 class="card-title" data-key="lcd_text_title">텍스트 출력</h2>
    <label class="form-label" for="lcd-text" data-key="lcd_text_label">출력할 텍스트 (줄바꿈 지원)</label>
    <textarea id="lcd-text" data-key="lcd_ph" placeholder="여기에 출력할 내용을 입력하세요..." oninput="updateLcdPreview()">안녕하세요!\n파이브레인입니다.</textarea>

    <div class="field-grid">
      <label><span data-key="font_size">폰트 크기</span><input type="number" id="lcd-size" value="24" min="8" max="80" step="2" oninput="updateLcdPreview()"/></label>
      <label><span data-key="x_pos">X 위치</span><input type="number" id="lcd-x" value="10" min="0" max="230" oninput="updateLcdPreview()"/></label>
      <label><span data-key="y_pos">Y 위치</span><input type="number" id="lcd-y" value="10" min="0" max="310" oninput="updateLcdPreview()"/></label>
      <label><span data-key="text_color">글자색</span><input type="color" id="lcd-fg" value="#ffffff" oninput="updateLcdPreview()"/></label>
      <label><span data-key="bg_color">배경색</span><input type="color" id="lcd-bg" value="#000000" oninput="updateLcdPreview()"/></label>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary btn-grow" onclick="sendLcdText()"><i class="fa-solid fa-paper-plane"></i><span data-key="lcd_send_btn">LCD에 출력</span></button>
      <button class="btn" onclick="clearLcd()"><i class="fa-solid fa-eraser"></i><span data-key="lcd_clear_btn">화면 지우기</span></button>
    </div>
    <div class="result-box" id="lcd-status" data-key="waiting">대기 중...</div>
  </div>

  <div class="card">
    <h2 class="card-title" data-key="system_title">시스템</h2>
    <p class="card-desc" data-key="lcd_reset_desc" data-html>
      network_disp.py를 재시작합니다.<br>카메라가 꺼진 상태에서만 동작합니다.
    </p>
    <button class="btn btn-danger" onclick="resetOled()"><i class="fa-solid fa-rotate"></i><span data-key="lcd_reset_btn">LCD 초기화 (network_disp 재시작)</span></button>
    <div class="result-box" id="oled-reset-status" data-key="waiting">대기 중...</div>
  </div>
</section>

</main>
</div>

<script src="/static/ko2en.js?ver=260924v1"></script>
<script src="/static/pibo-ui.js?ver=260924v1"></script>
<script src="/static/index.js?ver=260924v1"></script>
</body>
</html>
