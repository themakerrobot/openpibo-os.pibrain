<!DOCTYPE html>
<html lang="ko" data-product="piBo">
<head>
  <title>로봇 놀이 · piBo</title>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="../static/all.min.css" type="text/css" />
  <link rel="stylesheet" href="../static/pibo-ui.css?ver=261123v20" />
  <link rel="stylesheet" href="../static/play.css?ver=261124v1" />
  <link rel="shortcut icon" href="../static/icon.png?ver=261123v1" type="image/png" />
  <!-- 문구는 IDE 의 ko2en.js 를 같이 쓴다(kids_* 키, 영문판 델타를 늘리지 않으려고). IDE(80)는 늘 떠 있다 -->
  <script>(function () { var p = new URLSearchParams(location.search).get('ide') || 80;   /* ?ide= 는 시험용 */
    document.write('<script src="http://' + location.hostname + ':' + p + '/static/ko2en.js?ver=261124v1"><\/script>');
    /* 처음 화면 그림 — 대문과 같은 파이보 캐릭터 장면(IDE 의 pibo-art.js, 261123). 못 받으면 Font Awesome 기호 */
    document.write('<script src="http://' + location.hostname + ':' + p + '/static/v2/pibo-art.js?ver=261123v5"><\/script>'); })();</script>
</head>

<!-- pb-plain: 키트의 pb-v2 층을 얹지 않는다(그 층의 앱 버튼 규칙이 카드 색을 덮는다) -->
<body class="pb pb-shell pb-plain kids" data-app="play">
  <script>/* 화면 밝기를 첫 페인트 전에 (규칙은 pibo-ui.js 의 getTheme 과 같다. 고른 적 없으면 soft) */
  (function () { try { var m = document.cookie.match(/(?:^|;\s*)pibo_theme=(light|soft|dark)/);
    document.documentElement.setAttribute('data-theme', m ? m[1] : 'soft'); } catch (e) {} })();</script>
  <header class="pb-header">
    <span class="pb-header__brand"><i class="fa-solid fa-robot" id="brand_icon"></i><b id="brand_name">piBo</b><span class="pb-header__app" id="app_title"></span></span>
    <div class="pb-iconbar">
      <button type="button" class="pb-iconbtn" id="start_bt" hidden><i class="fa-solid fa-gamepad"></i><span class="pb-iconbtn__label" id="start_label"></span></button>
      <button type="button" class="pb-iconbtn" id="home_bt" data-pb-home><i class="fa-solid fa-house"></i><span class="pb-iconbtn__label"></span></button>
      <a class="pb-iconbtn" id="fullscreen_bt" data-title-key="kids_fullscreen"><span id="fullscreen_txt"></span><span class="pb-iconbtn__label" data-key="kids_fullscreen"></span></a>
      <select class="pb-field pb-field--sm" id="language" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option></select>
    </div>
  </header>

  <main class="kids-main">
    <!-- 처음 — 키우기 + (파이보 조종하기 / PiBrain 픽셀 그림). play.js 가 그린다 -->
    <section class="kids-view" id="v_home" hidden>
      <div class="kids-home" id="home_grid"></div>
    </section>

    <!-- 키우기 -->
    <section class="kids-view" id="v_pet" hidden>
      <div class="kids-bar">
        <button type="button" class="kids-back" data-go="home" data-title-key="kids_back"><i class="fa-solid fa-arrow-left"></i></button>
        <b class="kids-petname" id="pet_name"></b>
        <span class="kids-petkind" id="pet_kind"></span>
        <span class="kids-bar__fill"></span>
        <button type="button" class="kids-chip" id="custom_bt"><i class="fa-solid fa-palette"></i><span data-key="kids_custom"></span></button>
        <button type="button" class="kids-chip" id="graph_bt"><i class="fa-solid fa-chart-line"></i><span data-key="kids_graph"></span></button>
      </div>
      <div class="kids-petwrap">
        <div class="kids-petstage">
          <div class="kids-bubble" id="pet_bubble" hidden></div>
          <button type="button" class="kids-pet" id="pet_art" data-title-key="kids_pet_touch"></button>
          <p class="kids-input" id="pet_input" hidden></p>
        </div>
        <div class="kids-petside">
          <div class="kids-stats" id="pet_stats"></div>
          <div class="kids-acts" id="pet_acts"></div>
        </div>
      </div>
    </section>
    <!-- 조종하기 (로봇 놀이, 파이보만) — 누르면 바로 한다 -->
    <section class="kids-view" id="v_drive" hidden>
      <div class="kids-bar">
        <button type="button" class="kids-back" data-go="home" data-title-key="kids_back"><i class="fa-solid fa-arrow-left"></i></button>
        <h1 class="kids-h1 kids-h1--bar" data-key="kids_drive"></h1>
      </div>
      <p class="kids-drive__safe"><i class="fa-solid fa-triangle-exclamation"></i><span data-key="kids_drive_safe"></span></p>
      <div class="kids-drive">
        <div class="kids-drive__box kids-drive__box--pad">
          <h2 class="kids-drive__h"><i class="fa-solid fa-arrows-up-down-left-right"></i><span data-key="kids_drive_move"></span></h2>
          <div class="kids-dpad" id="dpad"></div>
        </div>
        <div class="kids-drive__box">
          <h2 class="kids-drive__h"><i class="fa-solid fa-child-reaching"></i><span data-key="kids_drive_motion"></span></h2>
          <div class="kids-dmoves" id="dmotions"></div>
        </div>
      </div>
      <p class="kids-note kids-drive__hint" data-key="kids_drive_hint"></p>
    </section>
    <!-- 픽셀 그림 (PiBrain 만) — 태블릿에서 그리면 LCD 에 그대로. 물리 버튼은 쓰지 않는다 -->
    <section class="kids-view" id="v_art" hidden>
      <div class="kids-bar">
        <button type="button" class="kids-back" data-go="home" data-title-key="kids_back"><i class="fa-solid fa-arrow-left"></i></button>
        <h1 class="kids-h1 kids-h1--bar" data-key="play_art"></h1>
        <div class="kids-seg" id="ar_size"></div>
      </div>
      <p class="kids-art__where"><i class="fa-solid fa-display"></i><span data-key="play_art_where"></span></p>
      <div class="kids-art">
        <div class="kids-art__board">
          <div class="kids-art__tools">
            <div class="kids-seg" id="ar_tools"></div>
            <span class="kids-bar__fill"></span>
            <button type="button" class="kids-chip" id="ar_undo"><i class="fa-solid fa-rotate-left"></i><span data-key="play_art_undo"></span></button>
            <button type="button" class="kids-chip" id="ar_clear"><i class="fa-solid fa-trash-can"></i><span data-key="play_art_clear"></span></button>
          </div>
          <div class="kids-art__canvaswrap" id="ar_wrap"><canvas id="ar_canvas"></canvas></div>
          <div class="kids-art__palette" id="ar_palette"></div>
        </div>
        <div class="kids-art__side">
          <div class="kids-art__box">
            <h2 class="kids-drive__h"><i class="fa-solid fa-film"></i><span data-key="play_art_frames"></span></h2>
            <div class="kids-art__frames" id="ar_frames"></div>
            <p class="kids-note" data-key="play_art_frames_tip"></p>
            <span class="pb-label" data-key="play_art_speed"></span>
            <div class="kids-seg" id="ar_fps"></div>
            <div class="kids-art__acts">
              <button type="button" class="kids-btn kids-btn--tint" id="ar_play"><i class="fa-solid fa-play"></i><span data-key="play_art_play"></span></button>
              <button type="button" class="kids-btn" id="ar_replay" data-title-key="play_art_replay_tip"><i class="fa-solid fa-clock-rotate-left"></i><span data-key="play_art_replay"></span></button>
            </div>
          </div>
          <div class="kids-art__box">
            <div class="kids-art__acts">
              <button type="button" class="kids-btn kids-btn--main" id="ar_save"><i class="fa-solid fa-floppy-disk"></i><span data-key="play_art_save"></span></button>
              <button type="button" class="kids-btn" id="ar_new"><i class="fa-solid fa-file"></i><span data-key="play_art_new"></span></button>
            </div>
            <h2 class="kids-drive__h kids-art__galh"><i class="fa-solid fa-images"></i><span data-key="play_art_gallery"></span><small id="ar_count"></small></h2>
            <div class="kids-art__gallery" id="ar_gallery"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 꾸미기 -->
  <div class="kids-modal" id="dlg_custom" hidden>
    <div class="kids-modal__box kids-custom">
      <h2 class="pb-title" data-key="kids_custom"></h2>
      <div class="kids-custom__grid">
        <div class="kids-custom__preview" id="cu_preview"></div>
        <div>
          <span class="pb-label" data-key="kids_custom_name"></span>
          <div class="kids-names" id="cu_names"></div>
          <input class="pb-field kids-namein" id="cu_name" maxlength="8" autocomplete="off">
          <span class="pb-label" data-key="kids_custom_color"></span>
          <div class="kids-colors" id="cu_colors"></div>
          <span class="pb-label" data-key="kids_custom_hat"></span>
          <div class="kids-names" id="cu_hats"></div>
          <span class="pb-label" data-key="kids_custom_glasses"></span>
          <div class="kids-names" id="cu_glasses"></div>
        </div>
      </div>
      <span class="pb-label" data-key="kids_custom_kind"></span>
      <div class="kids-kinds" id="cu_kinds"></div>
      <div class="kids-modal__btns">
        <button type="button" class="kids-btn" data-close><span data-key="kids_cancel"></span></button>
        <button type="button" class="kids-btn kids-btn--main" id="cu_save"><i class="fa-solid fa-check"></i><span data-key="kids_done"></span></button>
      </div>
    </div>
  </div>

  <!-- 관찰 일기 -->
  <div class="kids-modal" id="dlg_graph" hidden>
    <div class="kids-modal__box kids-graph">
      <h2 class="pb-title" data-key="kids_graph"></h2>
      <div class="kids-graph__chart" id="gr_chart"></div>
      <div class="kids-graph__legend" id="gr_legend"></div>
      <p class="kids-graph__rates" id="gr_rates"></p>
      <div class="kids-modal__btns">
        <button type="button" class="kids-btn kids-btn--main" data-close><span data-key="kids_close"></span></button>
      </div>
    </div>
  </div>


  <script src="../static/pibo-ui.js?ver=261123v20"></script>
  <script src="../static/pet.js?ver=261123v1"></script>
  <script src="../static/play.js?ver=261123v20"></script>
</body>
</html>
