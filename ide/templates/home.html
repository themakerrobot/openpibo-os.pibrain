<!DOCTYPE html>
<html lang="ko" data-product="PiBrain">
<head>
  <title data-key="home_title">처음 화면</title>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="../static/all.min.css" type="text/css" />
  <link rel="stylesheet" href="../static/pibo-ui.css?ver=261123v1" />
  <link rel="stylesheet" href="../static/v2/home.css?ver=261123v3" />
  <link rel="stylesheet" href="../static/v2/home-sheet.css?ver=261123v1" />
  <link rel="shortcut icon" href="../static/icon.png?ver=261102v1" type="image/png" />
  <!-- 첫 화면(대문, 261123). 앱 서버는 그대로 따로 돌고, 여기선 골라서 같은 탭으로 들어간다. 코드는 v2/home.js(두 리포 같은 파일) -->
  <script src="../static/ko2en.js?ver=261123v3"></script>
</head>
<!-- pb-plain: 키트의 pb-v2 층을 얹지 않는다(그 층의 앱 버튼 규칙이 아이콘 색을 덮는다). 귀염귀염 컨셉(261123, 사용자) — AUDIT.md 예외 -->
<body class="pb pb-shell pb-plain home">
  <script>/* 화면 밝기를 첫 페인트 전에 (규칙은 pibo-ui.js 의 getTheme 과 같다. 고른 적 없으면 soft) */
  (function () { try { var m = document.cookie.match(/(?:^|;\s*)pibo_theme=(light|soft|dark)/);
    document.documentElement.setAttribute('data-theme', m ? m[1] : 'soft'); } catch (e) {} })();</script>
  <header class="pb-header">
    <span class="pb-header__brand"><i class="fa-solid fa-brain"></i><b>PiBrain</b></span>
    <div class="pb-iconbar">
      <a class="pb-iconbtn" id="fullscreen_bt" data-title-key="nav_fullscreen"><span id="fullscreen_txt"></span><span class="pb-iconbtn__label" data-key="nav_fullscreen"></span></a>
      <select class="pb-field pb-field--sm" id="language" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option></select>
    </div>
  </header>

  <main class="home-main">
    <span class="home-blob home-blob--a"></span><span class="home-blob home-blob--b"></span><span class="home-blob home-blob--c"></span>
    <div class="home-wrap">
      <div class="home-left">
        <div class="home-hi">
          <span class="home-pal" id="home_pal" aria-hidden="true"></span>
          <div class="home-bubble"><h1 data-key="home_hello"></h1><p id="home_sub"></p></div>
          <div class="home-nm" aria-hidden="true"><span data-key="home_nm_name"></span><i></i><span data-key="home_nm_date"></span><i></i></div>
        </div>
        <section class="home-band home-band--make" data-no="1">
          <div class="home-sec"><span><i class="fa-solid fa-wand-magic-sparkles"></i><b data-key="home_sec_make"></b></span><small data-key="home_sec_make_d"></small></div>
          <div class="home-apps" id="apps_make"></div>
        </section>
        <div class="home-two">
          <section class="home-band home-band--play" data-no="2">
            <div class="home-sec home-sec--play"><span><i class="fa-solid fa-heart"></i><b data-key="home_sec_play"></b></span><small data-key="home_sec_play_d"></small></div>
            <div class="home-apps home-apps--2" id="apps_play"></div>
          </section>
          <section class="home-band home-band--admin" data-no="3">
            <div class="home-sec home-sec--admin"><span><i class="fa-solid fa-user-graduate"></i><b data-key="home_sec_admin"></b></span><small data-key="home_sec_admin_d"></small></div>
            <div class="home-apps home-apps--2" id="apps_admin"></div>
          </section>
        </div>
      </div>
      <aside class="home-side">
        <section class="home-w">
          <h2><i class="fa-brain fa-solid"></i><span>PiBrain</span><em id="st_ver"></em></h2>
          <div id="st_rows"></div>
        </section>
        <section class="home-w home-w--recent">
          <h2><i class="fa-solid fa-clock-rotate-left"></i><span data-key="home_continue"></span></h2>
          <div id="recent"></div>
        </section>
      </aside>
    </div>
  </main>

  <!-- 설정 · 확인 창(home.js 가 채운다) -->
  <div class="home-modal" id="home_modal" hidden role="dialog" aria-modal="true"><div class="home-modal__box" id="home_modal_box"></div></div>

  <script src="../static/socket.io.min.js?ver=240319v3"></script>
  <script src="../static/pibo-ui.js?ver=261123v2"></script>
  <script src="../static/v2/home.js?ver=261123v3"></script>
</body>
</html>
