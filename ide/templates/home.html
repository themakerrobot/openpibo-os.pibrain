<!DOCTYPE html>
<html lang="ko" data-product="piBrain">
<head>
  <title data-key="home_title">처음 화면</title>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="piBrain — 블록·파이썬 코딩 · 도구 · AI 가르치기 / Block and Python coding, tools, teach AI" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="../static/all.min.css" type="text/css" />
  <link rel="stylesheet" href="../static/pibo-ui.css?ver=261126v4" />
  <link rel="stylesheet" href="../static/v2/home.css?ver=261126v2" />
  <link rel="shortcut icon" href="../static/icon.png?ver=261124v1" type="image/png" />
  <!-- 첫 화면(대문, 261123). 앱 서버는 그대로 따로 돌고, 여기선 골라서 같은 탭으로 들어간다. 코드는 v2/home.js(두 리포 같은 파일) -->
  <script src="../static/ko2en.js?ver=261126v4"></script>
</head>
<!-- pb-plain: 키트의 pb-v2 층을 얹지 않는다. 학습지 컨셉(261123, 사용자 — ai-lab 과 같게) -->
<body class="pb pb-shell pb-plain home">
  <script>/* 화면 밝기를 첫 페인트 전에 (규칙은 pibo-ui.js 의 getTheme 과 같다. 고른 적 없으면 soft) */
  (function () { try { var m = document.cookie.match(/(?:^|;\s*)pibo_theme=(light|soft|dark)/);
    document.documentElement.setAttribute('data-theme', m ? m[1] : 'soft'); } catch (e) {} })();</script>
  <header class="pb-header">
    <span class="pb-header__brand"><i class="fa-solid fa-brain"></i><b>piBrain</b></span>
    <div class="pb-iconbar">
      <a class="pb-iconbtn" id="fullscreen_bt" data-title-key="nav_fullscreen"><span id="fullscreen_txt"></span><span class="pb-iconbtn__label" data-key="nav_fullscreen"></span></a>
      <select class="pb-field pb-field--sm" id="language" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option></select>
    </div>
  </header>

  <main class="home-main">
    <div class="home-wrap">
      <!-- 활동지 한 장: 왼쪽 철 구멍 · 빨간 여백선 · 머리(캐릭터 · 제목 · 날짜) · 활동 1~3 -->
      <article class="sheet">
        <span class="sheet__holes" aria-hidden="true"><i></i><i></i><i></i></span>
        <header class="sheet__head">
          <span class="home-pal" id="home_pal" aria-hidden="true"></span>
          <div class="sheet__title">
            <span class="sheet__eyebrow" data-key="home_eyebrow"></span>
            <h1><span class="hl" data-key="home_hello"></span></h1>
            <p id="home_sub"></p>
          </div>
          <div class="sheet__date" id="home_date"></div>
        </header>
        <section class="act act--make">
          <h2 class="act__h"><span class="act__no">1</span><b data-key="home_sec_make"></b><small data-key="home_sec_make_d"></small></h2>
          <div class="act__grid act__grid--4" id="apps_make"></div>
        </section>
        <div class="act-two">
          <section class="act act--play">
            <h2 class="act__h"><span class="act__no">2</span><b data-key="home_sec_play"></b><small data-key="home_sec_play_d"></small></h2>
            <div class="act__grid act__grid--list" id="apps_play"></div>
          </section>
          <section class="act act--admin">
            <h2 class="act__h"><span class="act__no">3</span><b data-key="home_sec_admin"></b><small data-key="home_sec_admin_d"></small></h2>
            <div class="act__grid act__grid--list" id="apps_admin"></div>
          </section>
        </div>
      </article>
      <aside class="home-side">
        <section class="card-st">
          <h2><i class="fa-solid fa-heart-pulse"></i><span data-key="home_status"></span><em id="st_ver"></em></h2>
          <div id="st_rows"></div>
        </section>
        <section class="memo">
          <span class="memo__tape" aria-hidden="true"></span>
          <h2><i class="fa-solid fa-clock-rotate-left"></i><span data-key="home_continue"></span></h2>
          <div id="recent" data-user></div>
        </section>
      </aside>
    </div>
    <!-- 꼬리말(261126): 제품 · 버전 · © · 도움말 · 라이선스 -->
    <footer class="home-foot" id="home_foot"></footer>
  </main>

  <!-- 설정 · 확인 창(home.js 가 채운다) -->
  <div class="home-modal" id="home_modal" hidden role="dialog" aria-modal="true"><div class="home-modal__box" id="home_modal_box"></div></div>

  <script src="../static/socket.io.min.js?ver=240319v3"></script>
  <script src="../static/pibo-ui.js?ver=261126v4"></script>
  <script src="../static/v2/pibo-art.js?ver=261125v1"></script>
  <script src="../static/v2/home.js?ver=261126v4"></script>
</body>
</html>
