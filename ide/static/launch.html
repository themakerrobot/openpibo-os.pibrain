<!doctype html>
<html lang="ko" data-product="PiBrain">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PiBrain</title>
<link rel="stylesheet" href="all.min.css">
<link rel="stylesheet" href="pibo-ui.css?ver=261027v3">
<link rel="shortcut icon" href="icon.png" type="image/x-icon">
<script>/* 화면 밝기를 첫 페인트 전에 (pibo-ui.js 의 getTheme 과 같은 규칙. 고른 적 없으면 soft) */
(function () { try { var m = document.cookie.match(/(?:^|;\s*)pibo_theme=(light|soft|dark)/);
  document.documentElement.setAttribute('data-theme', m ? m[1] : 'soft'); } catch (e) {} })();</script>
<style>
  /* 도구·분류기·대화를 새 탭으로 열 때 거치는 대기 페이지.
     IDE 가 버튼을 누른 '그 순간' 이 탭을 연다 — 몇 초 뒤에 window.open 하면
     브라우저가 팝업으로 막을 수 있어서다. 여기서 서비스를 켜고, 실제로 응답할
     때까지 기다린 뒤 스스로 그 주소로 이동한다. */
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--pb-font); color: var(--v2-ink); position: relative; isolation: isolate; }
  /* 배경: 노랑·파랑·초록 빛 번짐이 천천히 흐른다(그림 파일 없이 그라데이션만, transform 으로만 움직인다) */
  body::before {
    content: ""; position: fixed; top: -20%; right: -20%; bottom: -20%; left: -20%; z-index: -1; pointer-events: none;
    background: radial-gradient(38% 42% at 28% 30%, rgba(251, 201, 45, .30), transparent 70%),
                radial-gradient(34% 38% at 74% 66%, rgba(37, 99, 235, .16), transparent 70%),
                radial-gradient(30% 30% at 62% 18%, rgba(31, 157, 98, .10), transparent 70%);
    animation: lp-drift 18s ease-in-out infinite alternate;
  }
  html[data-theme="dark"] body::before { opacity: .5; }
  @keyframes lp-drift { from { transform: translate(-3%, -2%) rotate(0deg); } to { transform: translate(3%, 3%) rotate(6deg); } }
  .wrap { min-height: calc(100vh - 48px); display: flex; align-items: center; justify-content: center; padding: 16px; }
  /* 카드: 대화상자와 같은 모양(모서리 16 · 떠 있는 면 · 테두리). 옅은 바닥 위에서도 가장자리가 보이게 */
  .card { background: var(--v2-raise); border: 1px solid var(--v2-line-2); border-radius: var(--r-dlg);
          box-shadow: 0 12px 32px var(--v2-shadow);
          width: min(440px, 100%); padding: 26px 24px 20px; animation: pb-rise .3s cubic-bezier(.34, 1.4, .64, 1) backwards; }
  .ttl { display: flex; align-items: center; gap: 12px; font: 700 var(--fs-xl)/1.25 var(--font-ui); margin: 0 0 18px; }
  /* 아이콘 둘레 진행 링: 기다리는 동안 돌고, 끝나면 초록·실패면 빨강으로 멈춘다(body[data-state]) */
  .ring { position: relative; display: inline-grid; place-items: center; flex: none;
          width: 44px; height: 44px; border-radius: 50%; background: var(--v2-sunken); }
  .ring > i { font-size: 19px; }
  .ring::before {
    content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0 55%, var(--v2-accent) 100%);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
    animation: lp-spin 1s linear infinite;
  }
  body[data-state="done"] .ring::before { animation: none; background: var(--v2-green); }
  body[data-state="fail"] .ring::before { animation: none; background: var(--v2-red); }
  @keyframes lp-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { body::before, .ring::before, .card { animation: none !important; } }
  ol { list-style: none; margin: 0 0 16px; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 7px 0; color: var(--v2-ink-3); font: 700 15px/1.3 var(--font-ui); }
  li i { width: 18px; text-align: center; }
  li i.pending { font-size: 8px; opacity: .45; }   /* fa-regular 글꼴은 기기에 없다. solid 원을 작게 */
  li[data-s="now"]  { color: var(--v2-ink); }
  li[data-s="done"] { color: var(--v2-green-ink); }   /* 4.6:1 이상 */
  li[data-s="fail"] { color: var(--v2-red-ink); }
  li[data-s="fail"] i { color: var(--v2-red); }
  li .sec { margin-left: auto; font: 700 13px var(--pb-mono); color: var(--v2-ink-2); }
  .bar { height: 6px; border-radius: 3px; background: var(--v2-sunken); overflow: hidden; margin: 4px 0 14px; }
  .bar > div { height: 100%; width: 0; background: var(--v2-accent); transition: width .4s ease; }   /* 진행은 강조 파랑(노랑은 상단바만) */
  body[data-state="fail"] .bar > div { background: var(--v2-red); }
  body[data-state="done"] .bar > div { background: var(--v2-green); }
  .msg { min-height: 20px; font: 14px/1.5 var(--font-ui); color: var(--v2-ink-2); margin: 0 0 14px; }
  .msg.err { color: var(--v2-ink); }   /* 실패는 제목·빨간 단계·막대가 알린다. 여기는 할 일만 */
  body[data-state="fail"] .ring > i { color: var(--v2-red); }
  .acts { display: flex; justify-content: flex-end; gap: 8px; }
  .acts [hidden] { display: none; }
</style>
</head>
<body class="pb pb-v2">
<header class="pb-header">
  <span class="pb-header__brand"><i class="fa-solid fa-brain"></i><b>PiBrain</b><span class="pb-header__app" id="app_name" hidden></span></span>
</header>
<div class="wrap">
  <div class="card" role="status" aria-live="polite">
    <p class="ttl"><span class="ring"><i id="icon" class="fa-solid fa-microchip"></i></span><span id="title"></span></p>
    <ol>
      <li id="s1"><i class="fa-solid fa-circle pending"></i><span data-t="s1"></span></li>
      <li id="s2"><i class="fa-solid fa-circle pending"></i><span data-t="s2"></span><span class="sec" id="sec"></span></li>
      <li id="s3"><i class="fa-solid fa-circle pending"></i><span data-t="s3"></span></li>
    </ol>
    <div class="bar"><div id="bar"></div></div>
    <p class="msg" id="msg"></p>
    <div class="acts">
      <button type="button" class="pb-btn" id="close"><span data-t="close"></span></button>
      <button type="button" class="pb-btn pb-btn--accent" id="retry" hidden><i class="fa-solid fa-rotate-right"></i><span data-t="retry"></span></button>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';
  var Q = new URLSearchParams(location.search);
  var L = (Q.get('lang') || (function(){ try { return localStorage.getItem('language'); } catch (e) { return null; } })()
           || ((navigator.language || '').indexOf('ko') === 0 ? 'ko' : 'en')) === 'ko' ? 'ko' : 'en';
  document.documentElement.lang = L;
  var T = {
    // 단계 이름은 끝나도 바뀌지 않는 명사로(261027v4). 진행·끝·실패는 앞의 아이콘이 보여 준다
    s1:      { ko: '켜기 요청',                   en: 'Request' },
    s2:      { ko: '준비 확인',                   en: 'Check ready' },
    s3:      { ko: '열기',                        en: 'Open' },
    close:   { ko: '닫기',                        en: 'Close' },
    retry:   { ko: '다시 시도',                   en: 'Try again' },
    title:   { ko: '{0} 켜는 중…',                en: 'Starting {0}…' },
    slow:    { ko: '처음 켤 때는 조금 더 걸릴 수 있어요.', en: 'The first start can take a little longer.' },
    llmslow: { ko: '대화 모델은 크기가 커서 1~2분 걸릴 수 있어요.', en: 'The chat model is large and can take a minute or two.' },
    cors:    { ko: '준비됐는지 확인하지 못했지만 열어 볼게요. 아직 준비 중이면 잠시 뒤 새로고침해 주세요.',
               en: 'Could not confirm it is ready. Opening it anyway. If it is still loading, refresh in a moment.' },
    // 제목이 이미 '{0}를 켜지 못했어요' 라 안내만(261027v4)
    fail:    { ko: 'PiBrain이 켜져 있고 같은 WiFi에 있는지 확인한 뒤 다시 시도해 주세요.',
               en: 'Check that PiBrain is on and on the same WiFi, then try again.' },
    bad:     { ko: '알 수 없는 도구예요.', en: 'Unknown tool.' },
    fail_title: { ko: '{0}를 켜지 못했어요', en: 'Could not start {0}' }
  };
  function t(k, a) { var s = (T[k] && (T[k][L] || T[k].en)) || k; return a == null ? s : s.replace('{0}', a); }
  Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (e) { e.textContent = t(e.getAttribute('data-t')); });

  var HOST = location.hostname;
  var SVC = {
    tools:      { port: 50000, on: '/tools?enable=on',      check: 'port',   limit: 60,
                  name: { ko: '도구', en: 'Tools' },               icon: 'fa-microchip' },
    classifier: { port: 50010, on: '/classifier?enable=on', check: 'port',   limit: 60,
                  name: { ko: '분류기', en: 'Classifier' },   icon: 'fa-images' },
    // 대화: 대화 웹(chat/run_chat.py, 50030)이 열리면 바로 간다. 모델 준비(1~2분)는 대화 화면이 보여 준다(261026)
    llm:        { port: 50030, on: '/llm?enable=on',        check: 'port',   limit: 60,
                  name: { ko: '대화', en: 'Chat' },                icon: 'fa-comment' },
    // 체험 앱 '로봇 놀이'(kids/run_kids.py, 50060, 261028 시험 중)
    kids:       { port: 50060, on: '/kids?enable=on',       check: 'port',   limit: 60,
                  name: { ko: '로봇 놀이', en: 'Robot Play' },     icon: 'fa-shapes' }
  };
  var key = Q.get('svc'), S = SVC[key];
  var $ = function (id) { return document.getElementById(id); };
  $('close').onclick = function () {
    try { window.close(); } catch (e) {}
    setTimeout(function () { if (!window.closed) location.href = 'http://' + HOST + '/'; }, 200);
  };
  var PRODUCT = document.documentElement.getAttribute('data-product') || '';
  function setTitle(s) { $('title').textContent = s; document.title = PRODUCT ? s + ' · ' + PRODUCT : s; }   // 탭 제목은 '… · PiBrain' (다른 화면과 같은 꼴)
  if (!S) { document.body.dataset.state = 'fail'; setTitle(t('bad')); $('icon').className = 'fa-solid fa-circle-exclamation'; return; }

  var name = S.name[L];
  setTitle(t('title', name));
  $('app_name').textContent = name; $('app_name').hidden = false;
  $('icon').className = 'fa-solid ' + S.icon;
  var target = 'http://' + HOST + ':' + S.port + '/';

  function step(n, state) {
    var li = $('s' + n); li.setAttribute('data-s', state);
    li.firstElementChild.className = state === 'done' ? 'fa-solid fa-circle-check'
                                   : state === 'now'  ? 'fa-solid fa-spinner fa-spin'
                                   : state === 'fail' ? 'fa-solid fa-circle-xmark'
                                   : 'fa-solid fa-circle pending';
  }
  function withTimeout(ms) {
    var c = new AbortController(); setTimeout(function () { c.abort(); }, ms); return c.signal;
  }
  function turnOn() {
    // 서버는 systemctl start 만 하고 곧바로 200 을 준다. 실제 준비 여부는 아래에서 본다.
    return fetch('http://' + HOST + S.on, { cache: 'no-store', signal: withTimeout(4000) })
      .then(function () { return true; }, function () { return false; });
  }
  // 포트가 열렸는지: CORS 헤더가 없어도 no-cors 요청은 서버가 떠 있으면 성공, 꺼져 있으면 실패한다
  function portUp() {
    return fetch(target, { mode: 'no-cors', cache: 'no-store', signal: withTimeout(2500) })
      .then(function () { return true; }, function () { return false; });
  }
  // llama-server: /health 가 모델을 올리는 동안 503, 준비되면 200. CORS 기본 허용이라 상태가 읽힌다
  function llmState() {
    return fetch(target + 'health', { cache: 'no-store', signal: withTimeout(2500) })
      .then(function (r) { return r.ok ? 'ready' : 'loading'; },
            function () { return portUp().then(function (up) { return up ? 'blind' : 'down'; }); });
  }

  var t0 = 0, polling = null, resend = null;
  function stopTimers() { clearInterval(polling); clearInterval(resend); }
  function tick() {
    var s = Math.floor((Date.now() - t0) / 1000);
    $('sec').textContent = L === 'ko' ? s + '초' : s + ' s';   // 숫자+단위 규칙(5초 / 5 s)
    // 진행 바는 '예상'이 아니라 한도 대비 경과. 끝까지 차면 실패다
    $('bar').style.width = Math.min(95, Math.round(s / S.limit * 100)) + '%';
    if (s === 8) $('msg').textContent = t(key === 'llm' ? 'llmslow' : 'slow');
    return s;
  }
  function ready(note) {
    stopTimers();
    document.body.dataset.state = 'done';
    step(2, 'done'); step(3, 'now');
    $('bar').style.width = '100%';
    if (note) $('msg').textContent = note;
    setTimeout(function () { location.replace(target); }, note ? 1600 : 250);
  }
  function fail() {
    stopTimers();
    document.body.dataset.state = 'fail';
    step(2, 'fail');                       // 기다리다 한도를 넘긴 단계
    $('bar').style.width = '100%';
    setTitle(t('fail_title', name));
    $('msg').textContent = t('fail'); $('msg').className = 'msg err';
    $('retry').hidden = false; $('retry').focus();
  }
  function start() {
    document.body.dataset.state = 'busy'; setTitle(t('title', name));
    $('retry').hidden = true; $('msg').textContent = ''; $('msg').className = 'msg';
    step(1, 'now'); step(2, 'idle'); step(3, 'idle');
    t0 = Date.now(); tick();
    turnOn().then(function () {
      step(1, 'done'); step(2, 'now');
      // 켜기 요청을 5초마다 다시 보낸다. 같은 탭에서 이전 도구 페이지가 떠나며 보낸
      // enable=off 가 이 요청보다 늦게 도착해도 결국 켜진 상태로 끝나게 하려는 것이다.
      // 이미 켜진 서비스에 systemctl start 는 아무 일도 하지 않는다.
      resend = setInterval(turnOn, 5000);
      var busy = false;
      polling = setInterval(function () {
        var s = tick();
        if (s >= S.limit) return fail();
        if (busy) return; busy = true;
        (S.check === 'health' ? llmState() : portUp().then(function (u) { return u ? 'ready' : 'down'; }))
          .then(function (st) {
            busy = false;
            if (st === 'ready') ready();
            else if (st === 'blind') ready(t('cors'));
          });
      }, 1000);
    });
  }
  $('retry').onclick = start;
  start();
})();
</script>
</body>
</html>
